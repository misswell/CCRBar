name: CCRBar
options:
  bundleIdPrefix: com.ccrbar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.ccrbar.app
    SWIFT_EMIT_LOC_STRINGS: NO
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
  configs:
    Release:
      CODE_SIGN_ENTITLEMENTS: CCRBar/Resources/CCRBar.entitlements
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: U8U443D7ZL
      PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  CCRBar:
    type: application
    platform: macOS
    sources:
      - CCRBar
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: CCRBar/Resources/Info.plist
        PRODUCT_NAME: CCRBar
        PRODUCT_BUNDLE_IDENTIFIER: com.ccrbar.app
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: "5"
  CCRBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CCRBarTests
    dependencies:
      - target: CCRBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ccrbar.tests
